name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0 platforms;android-34

      # No Gradle wrapper in the repo: the wrapper jar is a binary and
      # the GitHub push flow is UTF-8 only, so CI uses the pinned
      # Gradle 8.2 directly. Local builds use the wrapper once the
      # jar is present, or the same setup-gradle action version.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: starbrook-news-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
