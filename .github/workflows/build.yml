name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # setup-android v3 defaults `packages` to `tools platform-tools`,
          # but Google no longer serves the legacy `tools` package, so
          # `sdkmanager tools` fails with "Failed to find package 'tools'"
          # and kills the step. Install platform-tools only; build-tools
          # 34.0.0 and platform android-34 come preinstalled on the
          # ubuntu-24.04 runner image.
          packages: 'platform-tools'

      # No Gradle wrapper in the repo: the wrapper jar is a binary and
      # the GitHub push flow is UTF-8 only, so CI uses the pinned
      # Gradle 8.2 directly. Local builds use the wrapper once the
      # jar is present, or the same setup-gradle action version.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Check Supabase anon key present
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "ANON_KEY_PRESENT=false"; else echo "ANON_KEY_PRESENT=true"; fi

      - name: Build debug APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: starbrook-news-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
